name: AuraPlayer
options:
  bundleIdPrefix: com.yourname # Замени на свой уникальный префикс
  deploymentTarget:
    iOS: "16.1"
  xcodeVersion: "15.4"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  AuraPlayer:
    type: application
    platform: iOS
    sources:
      - path: AuraPlayer
        excludes:
          - "AuraPlayerWidget.swift" # Исключаем файл виджета из основного таргета
    settings:
      base:
        INFOPLIST_FILE: AuraPlayer/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.AuraPlayer
        TARGETED_DEVICE_FAMILY: "1" # Только iPhone
    dependencies:
      - target: AuraPlayerWidget

  AuraPlayerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AuraPlayer/AuraPlayerWidget.swift
      - path: AuraPlayer/LiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.AuraPlayer.Widget
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_CFBundleDisplayName: "Aura Player Widget"
    info:
      path: AuraPlayer/WidgetInfo.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
